<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>keikai 収支共有</title>
<style>
  :root {
    --bg: #f2f2f7; --card: #ffffff; --text: #1c1c1e; --sub: #6e6e73; --faint: #aeaeb2;
    --line: #e5e5ea; --sales: #0a7cff; --expense: #ff8a00; --red: #ff3b30; --accent: #0a7cff;
    --shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --text: #f2f2f7; --sub: #98989f; --faint: #636366;
      --line: #38383a; --sales: #0a84ff; --expense: #ff9f0a; --red: #ff453a; --accent: #0a84ff; --shadow: none; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin: 8px 0 16px; }
  header h1 { font-size: 22px; margin: 0; }
  header .meta { color: var(--sub); font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; }
  .year { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 12px; }
  .year button { border: 0; background: var(--card); color: var(--accent); width: 36px; height: 36px;
    border-radius: 18px; font-size: 18px; cursor: pointer; box-shadow: var(--shadow); }
  .year button:disabled { color: var(--faint); cursor: default; }
  .year span { font-size: 20px; font-weight: 700; min-width: 90px; text-align: center; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 8px; }
  @media (max-width: 640px) { .cards { grid-template-columns: repeat(2, 1fr); } }
  .card { background: var(--card); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); }
  .card .t { font-size: 13px; color: var(--sub); }
  .card .t small { margin-left: 6px; font-size: 11px; }
  .card .v { font-size: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note { color: var(--sub); font-size: 12px; margin: 0 0 18px; }
  h2 { font-size: 17px; margin: 0 0 4px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
  .legend { font-size: 12px; color: var(--sub); font-weight: 400; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 4px 0 8px; vertical-align: -1px; }
  .scroller { overflow-x: auto; padding-bottom: 8px; -webkit-overflow-scrolling: touch; }
  .months { display: grid; grid-template-columns: repeat(12, minmax(132px, 1fr)); gap: 8px; min-width: 1660px; }
  @media (min-width: 1500px) { .months { min-width: 0; } }
  .chart { grid-column: 1 / -1; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); }
  .chart svg { display: block; width: 100%; height: 200px; }
  .month { background: var(--card); border-radius: 14px; padding: 10px; box-shadow: var(--shadow); border: 2px solid transparent; }
  .month.now { border-color: var(--accent); }
  .month h3 { margin: 0 0 6px; font-size: 16px; display: flex; align-items: center; gap: 6px; }
  .badge { font-size: 10px; color: #fff; background: var(--accent); border-radius: 8px; padding: 1px 6px; font-weight: 600; }
  .row { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit;
    padding: 3px 2px; border-radius: 6px; }
  .row .n { display: block; font-size: 11px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .a { display: block; text-align: right; font-size: 13px; }
  .row.total .a { font-weight: 700; }
  button.row { cursor: pointer; }
  button.row:hover { background: var(--bg); }
  button.row .n { color: var(--text); }
  button.row .n::after { content: " ›"; color: var(--faint); }
  .zero { color: var(--faint) !important; }
  .sec { font-size: 11px; font-weight: 700; margin: 8px 0 2px; padding-top: 6px; border-top: 1px solid var(--line); }
  .status { text-align: center; color: var(--sub); padding: 60px 16px; }
  .status.error { color: var(--red); }
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
    background: var(--card); color: var(--text); box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog.wide { width: min(1000px, calc(100vw - 32px)); height: calc(100vh - 48px); }
  .dh { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); gap: 8px; }
  .dh h4 { margin: 0; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dh .actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn { border: 0; background: var(--bg); color: var(--accent); border-radius: 10px; padding: 6px 12px; font: inherit; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .db { padding: 6px 16px 16px; overflow: auto; max-height: calc(100vh - 120px); }
  dialog.wide .db { height: calc(100% - 60px); max-height: none; padding: 0; }
  .db iframe, .db img { width: 100%; height: 100%; border: 0; object-fit: contain; display: block; background: #fff; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; margin: 10px 0; }
  dt { color: var(--sub); }
  dd { margin: 0; text-align: right; white-space: pre-wrap; word-break: break-word; }
  .files { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .file { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--bg);
    border: 0; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .file span:last-child { color: var(--accent); white-space: nowrap; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .list li:last-child { border-bottom: 0; }
  .list .top { display: flex; justify-content: space-between; gap: 12px; }
  .list .sub { color: var(--sub); font-size: 13px; }
  .h5 { font-size: 13px; color: var(--sub); margin: 14px 0 0; }
  footer { color: var(--faint); font-size: 12px; text-align: center; margin: 24px 0 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="title">収支</h1><span class="meta" id="meta"></span></header>
  <div id="app"><div class="status">読み込み中…</div></div>
  <footer>このページは閲覧専用です。データは暗号化されており、URLを知っている人だけが見られます。</footer>
</div>
<dialog id="dialog"></dialog>
<script>
"use strict";
// Read-only API token for the public database (CloudKit Console › Tokens & Keys › API Tokens).
const CK_API_TOKEN = "__CLOUDKIT_API_TOKEN__";
const CK_URL = "https://api.apple-cloudkit.com/database/1/iCloud.com.kazoo.BizKaikei/production/public/records/lookup";
const REFRESH_MS = 5 * 60 * 1000;

const state = { data: null, year: null, shareID: null, key: null };
const fileCache = new Map();

// ---------- Formatting ----------
const yen = (n) => (n < 0 ? "-¥" : "¥") + Math.abs(n).toLocaleString("ja-JP");
function compact(n) {
  const a = Math.abs(n);
  const f = (v) => (Math.round(v * 10) / 10).toLocaleString("ja-JP", { maximumFractionDigits: 1 });
  if (a >= 1e8) return f(n / 1e8) + "億";
  if (a >= 1e4) return f(n / 1e4) + "万";
  return yen(n);
}
const jpDate = (s) => { if (!s) return ""; const [y, m, d] = s.split("-").map(Number); return `${y}年${m}月${d}日`; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function niceCeiling(v) {
  if (v <= 0) return 10000;
  let m = 1; while (m * 10 <= v) m *= 10;
  for (const k of [1, 2, 5, 10]) if (k * m >= v) return k * m;
  return 10 * m;
}

// ---------- CloudKit + crypto ----------
function b64ToBytes(b64) {
  const s = atob(b64.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((b64.length + 3) % 4));
  const out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out;
}
async function lookup(names) {
  const records = [];
  for (let i = 0; i < names.length; i += 100) {
    const res = await fetch(`${CK_URL}?ckAPIToken=${encodeURIComponent(CK_API_TOKEN)}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ records: names.slice(i, i + 100).map((recordName) => ({ recordName })) }),
    });
    if (!res.ok) throw new Error(`サーバーに接続できませんでした (${res.status})`);
    records.push(...(await res.json()).records);
  }
  return records;
}
async function fetchBlob(blob, chunks) {
  const names = Array.from({ length: chunks }, (_, i) => `${state.shareID}-${blob}-${i}`);
  const records = await lookup(names);
  const parts = records.map((r) => {
    if (r.serverErrorCode || !r.fields?.data) throw new Error("データが見つかりません。共有が更新された可能性があります。再読み込みしてください。");
    return b64ToBytes(r.fields.data.value);
  });
  const all = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
  let o = 0; for (const p of parts) { all.set(p, o); o += p.length; }
  return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: all.slice(0, 12) }, state.key, all.slice(12)));
}
async function loadSnapshot() {
  const [head] = await lookup([state.shareID]);
  if (!head || head.serverErrorCode) throw new Error("この共有は見つかりませんでした。URLが変更されたか、共有が停止されています。");
  const bytes = await fetchBlob(head.fields.pointer.value, head.fields.count.value);
  return JSON.parse(new TextDecoder().decode(bytes));
}

// ---------- Aggregation (same rules as the app: by 請求日) ----------
const yearOf = (s) => Number(s.slice(0, 4));
const monthOf = (s) => Number(s.slice(5, 7));
function years() {
  const ys = new Set([...state.data.sales, ...state.data.expenses].map((x) => yearOf(x.invoiceDate)));
  ys.add(new Date().getFullYear());
  return [...ys].sort((a, b) => a - b);
}
function monthsOf(year) {
  return Array.from({ length: 12 }, (_, i) => {
    const m = i + 1;
    const sales = state.data.sales.filter((s) => yearOf(s.invoiceDate) === year && monthOf(s.invoiceDate) === m);
    const expenses = state.data.expenses.filter((e) => yearOf(e.invoiceDate) === year && monthOf(e.invoiceDate) === m);
    const byCat = Object.fromEntries(state.data.categories.map((c) => [c, 0]));
    for (const e of expenses) byCat[e.category] = (byCat[e.category] || 0) + e.amount;
    const salesTotal = sales.reduce((n, s) => n + s.amount, 0);
    const expenseTotal = expenses.reduce((n, e) => n + e.amount, 0);
    return { month: m, sales, expenses, byCat, salesTotal, expenseTotal, profit: salesTotal - expenseTotal };
  });
}

// ---------- Rendering ----------
function render() {
  const d = state.data;
  document.getElementById("title").textContent = (d.businessName ? d.businessName + " の" : "") + "収支";
  document.getElementById("meta").textContent = "最終更新 " + new Date(d.generatedAt).toLocaleString("ja-JP", { dateStyle: "medium", timeStyle: "short" });
  const ys = years();
  if (!ys.includes(state.year)) state.year = ys.includes(new Date().getFullYear()) ? new Date().getFullYear() : ys[ys.length - 1];
  const months = monthsOf(state.year);
  const sales = months.reduce((n, m) => n + m.salesTotal, 0);
  const expense = months.reduce((n, m) => n + m.expenseTotal, 0);
  const profit = sales - expense;
  const rate = sales === 0 ? "—" : (profit / sales * 100).toFixed(1) + "%";
  const now = new Date();
  const maxRows = Math.max(1, ...months.map((m) => m.sales.length));
  const idx = ys.indexOf(state.year);

  const monthHTML = months.map((m) => {
    const isNow = state.year === now.getFullYear() && m.month === now.getMonth() + 1;
    const saleRows = Array.from({ length: maxRows }, (_, i) => {
      const s = m.sales[i];
      if (s) return `<button class="row" data-sale="${esc(s.id)}"><span class="n">${esc(s.client)}</span><span class="a num">${yen(s.amount)}</span></button>`;
      if (i === 0) return `<div class="row"><span class="n">売上なし</span><span class="a num zero">${yen(0)}</span></div>`;
      return `<div class="row" style="visibility:hidden"><span class="n">-</span><span class="a">-</span></div>`;
    }).join("");
    const catRows = d.categories.map((c) => {
      const v = m.byCat[c] || 0;
      return v > 0
        ? `<button class="row" data-cat="${esc(c)}" data-month="${m.month}"><span class="n">${esc(c)}</span><span class="a num">${yen(v)}</span></button>`
        : `<div class="row"><span class="n">${esc(c)}</span><span class="a num zero">${yen(0)}</span></div>`;
    }).join("");
    return `<div class="month${isNow ? " now" : ""}">
      <h3>${m.month}月${isNow ? '<span class="badge">今月</span>' : ""}</h3>
      <div class="row total"><span class="n">売上合計</span><span class="a num" style="color:${m.salesTotal ? "var(--sales)" : "var(--faint)"}">${yen(m.salesTotal)}</span></div>
      <div class="row total"><span class="n">経費合計</span><span class="a num" style="color:${m.expenseTotal ? "var(--expense)" : "var(--faint)"}">${yen(m.expenseTotal)}</span></div>
      <div class="row total"><span class="n">差額</span><span class="a num" style="${m.profit < 0 ? "color:var(--red)" : ""}">${yen(m.profit)}</span></div>
      <div class="sec" style="color:var(--sales)">売上</div>${saleRows}
      <div class="sec" style="color:var(--expense)">経費</div>${catRows}
    </div>`;
  }).join("");

  document.getElementById("app").innerHTML = `
    <div class="year">
      <button id="prev" aria-label="前の年" ${idx <= 0 ? "disabled" : ""}>‹</button>
      <span>${state.year}年</span>
      <button id="next" aria-label="次の年" ${idx >= ys.length - 1 ? "disabled" : ""}>›</button>
    </div>
    <div class="cards">
      <div class="card"><div class="t">売上<small>税込</small></div><div class="v num" style="color:var(--sales)">${yen(sales)}</div></div>
      <div class="card"><div class="t">経費<small>税込</small></div><div class="v num" style="color:var(--expense)">${yen(expense)}</div></div>
      <div class="card"><div class="t">利益<small>税込</small></div><div class="v num" style="${profit < 0 ? "color:var(--red)" : ""}">${yen(profit)}</div></div>
      <div class="card"><div class="t">利益率</div><div class="v num">${rate}</div></div>
    </div>
    <p class="note">売上・経費とも税込・請求日ベースで反映</p>
    <h2>月別推移・内訳<span class="legend"><i style="background:var(--sales)"></i>売上<i style="background:var(--expense)"></i>経費</span></h2>
    <div class="scroller"><div class="months"><div class="chart" id="chart"></div>${monthHTML}</div></div>`;
  drawChart(months);
  window.onresize = () => drawChart(months);

  document.getElementById("prev").onclick = () => { state.year = ys[idx - 1]; render(); };
  document.getElementById("next").onclick = () => { state.year = ys[idx + 1]; render(); };
  document.querySelectorAll("[data-sale]").forEach((b) => b.onclick = () => showSale(b.dataset.sale));
  document.querySelectorAll("[data-cat]").forEach((b) => b.onclick = () => showCategory(b.dataset.cat, Number(b.dataset.month)));
}

// Drawn at the chart's real pixel size, with each month's bars centered over that month's box.
function drawChart(months) {
  const chart = document.getElementById("chart");
  if (!chart) return;
  const boxes = [...document.querySelectorAll(".month")];
  const origin = chart.getBoundingClientRect().left;
  const centers = boxes.map((b) => { const r = b.getBoundingClientRect(); return r.left - origin + r.width / 2; });
  const col = boxes[0] ? boxes[0].getBoundingClientRect().width : 100;
  chart.innerHTML = chartSVG(months, chart.clientWidth, centers, col);
}

function chartSVG(months, W, centers, col) {
  const H = 200, top = 34, bottom = 22;
  const plotH = H - top - bottom;
  const scale = niceCeiling(Math.max(...months.map((m) => Math.max(m.salesTotal, m.expenseTotal))));
  const y = (v) => top + plotH - plotH * Math.min(1, v / scale);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="月別の売上と経費">`;
  for (const k of [0, 0.5, 1]) {
    const yy = top + plotH - plotH * k;
    s += `<line x1="0" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`;
    s += `<text x="6" y="${yy - 3}" font-size="10" fill="var(--faint)">${compact(scale * k)}</text>`;
  }
  months.forEach((m, i) => {
    const cx = centers[i];
    const bw = Math.min(40, col * 0.26), gap = Math.max(2, bw * 0.15);
    const bars = [[m.salesTotal, cx - gap / 2 - bw, "var(--sales)"], [m.expenseTotal, cx + gap / 2, "var(--expense)"]];
    const labels = [];
    for (const [v, x, c] of bars) {
      if (v <= 0) continue;
      s += `<rect x="${x}" y="${y(v)}" width="${bw}" height="${top + plotH - y(v)}" rx="2" fill="${c}"><title>${yen(v)}</title></rect>`;
      labels.push({ v, x: x + bw / 2, y: y(v) - 4, c });
    }
    // Stack the shorter bar's label above the taller one's when they would overlap.
    labels.sort((a, b) => a.y - b.y);
    if (labels.length === 2 && labels[1].y - labels[0].y < 13) labels[1].y = labels[0].y - 13;
    for (const l of labels) s += `<text x="${l.x}" y="${l.y}" text-anchor="middle" font-size="11" font-weight="600" fill="${l.c}">${compact(l.v)}</text>`;
    s += `<text x="${cx}" y="${H - 6}" text-anchor="middle" font-size="12" fill="var(--sub)">${m.month}月</text>`;
  });
  return s + "</svg>";
}

// ---------- Dialogs ----------
const dialog = document.getElementById("dialog");
function openDialog(title, body, { wide = false, actions = "" } = {}) {
  dialog.className = wide ? "wide" : "";
  dialog.innerHTML = `<div class="dh"><h4>${esc(title)}</h4><div class="actions">${actions}<button class="btn" id="close">閉じる</button></div></div><div class="db">${body}</div>`;
  dialog.querySelector("#close").onclick = () => dialog.close();
  if (!dialog.open) dialog.showModal();
}
dialog.addEventListener("click", (e) => { if (e.target === dialog) dialog.close(); });
dialog.addEventListener("close", () => { dialog.innerHTML = ""; });

function fileButton(label, ref) {
  return `<button class="file" data-blob="${esc(ref.blob)}" data-chunks="${ref.chunks}" data-mime="${esc(ref.mimeType)}" data-label="${esc(label)}"><span>${esc(label)}</span><span>見る ›</span></button>`;
}
function bindFiles(back) {
  dialog.querySelectorAll("[data-blob]").forEach((b) => b.onclick = () =>
    showFile(b.dataset.label, { blob: b.dataset.blob, chunks: Number(b.dataset.chunks), mimeType: b.dataset.mime }, back));
}

function showSale(id) {
  const s = state.data.sales.find((x) => x.id === id);
  if (!s) return;
  const files = [];
  if (s.invoice) files.push(fileButton("添付した請求書", s.invoice));
  for (const d of s.documents) {
    if (d.pdf) files.push(fileButton(`${d.title} ${d.number}(${jpDate(d.issueDate)}発行)`, d.pdf));
  }
  openDialog("売上の詳細", `
    <dl>
      <dt>取引先</dt><dd>${esc(s.client)}</dd>
      <dt>金額(税込)</dt><dd class="num" style="color:var(--sales);font-weight:700">${yen(s.amount)}</dd>
      <dt>請求日</dt><dd>${jpDate(s.invoiceDate)}</dd>
      <dt>入金</dt><dd style="${s.paid ? "" : "color:var(--expense)"}">${s.paid ? "入金済み" : "未入金"}</dd>
      ${s.paid && s.paidDate ? `<dt>入金日</dt><dd>${jpDate(s.paidDate)}</dd>` : ""}
      ${s.memo ? `<dt>メモ</dt><dd>${esc(s.memo)}</dd>` : ""}
    </dl>
    <div class="h5">請求書</div>
    <div class="files">${files.join("") || '<div class="sub" style="color:var(--sub)">添付なし</div>'}</div>`);
  bindFiles(() => showSale(id));
}

function showCategory(category, month) {
  const list = state.data.expenses.filter((e) => e.category === category && yearOf(e.invoiceDate) === state.year && monthOf(e.invoiceDate) === month);
  const total = list.reduce((n, e) => n + e.amount, 0);
  openDialog(`${state.year}年${month}月 ${category}`, `
    <ul class="list">${list.map((e) => `<li>
      <div class="top"><span>${esc(e.payee || "(支払先なし)")}</span><span class="num" style="font-weight:600">${yen(e.amount)}</span></div>
      <div class="sub">${jpDate(e.invoiceDate)}${e.memo ? "・" + esc(e.memo) : ""}</div>
      ${e.invoice ? `<div class="files">${fileButton("請求書", e.invoice)}</div>` : ""}
    </li>`).join("")}</ul>
    <div class="top" style="display:flex;justify-content:space-between;margin-top:8px;font-weight:700"><span>合計</span><span class="num" style="color:var(--expense)">${yen(total)}</span></div>`);
  bindFiles(() => showCategory(category, month));
}

async function showFile(label, ref, back) {
  openDialog(label, '<div class="status">読み込み中…</div>', { wide: true, actions: '<button class="btn" id="back">‹ 戻る</button>' });
  dialog.querySelector("#back").onclick = back;
  try {
    let url = fileCache.get(ref.blob);
    if (!url) {
      const bytes = await fetchBlob(ref.blob, ref.chunks);
      url = URL.createObjectURL(new Blob([bytes], { type: ref.mimeType }));
      fileCache.set(ref.blob, url);
    }
    if (!dialog.open) return;
    const ext = ref.mimeType === "application/pdf" ? "pdf" : ref.mimeType.split("/")[1];
    const body = ref.mimeType.startsWith("image/") ? `<img src="${url}" alt="${esc(label)}">` : `<iframe src="${url}" title="${esc(label)}"></iframe>`;
    openDialog(label, body, { wide: true, actions:
      `<button class="btn" id="back">‹ 戻る</button><a class="btn" href="${url}" target="_blank" rel="noopener">新しいタブ</a><a class="btn" href="${url}" download="${esc(label)}.${ext}">保存</a>` });
    dialog.querySelector("#back").onclick = back;
  } catch (e) {
    openDialog(label, `<div class="status error">${esc(e.message)}</div>`, { wide: true, actions: '<button class="btn" id="back">‹ 戻る</button>' });
    dialog.querySelector("#back").onclick = back;
  }
}

// ---------- Start ----------
function fail(message) {
  document.getElementById("app").innerHTML = `<div class="status error">${esc(message)}</div>`;
}
async function refresh() {
  try {
    state.data = await loadSnapshot();
    if (!dialog.open) render();
  } catch (e) {
    if (!state.data) fail(e.message || "読み込めませんでした。");
  }
}
async function start() {
  const hash = location.hash.slice(1);
  if (hash === "demo") { state.data = demoData(); render(); return; }
  const [shareID, keyText] = hash.split(".");
  if (!shareID || !keyText) return fail("共有URLが正しくありません。アプリの「設定 › Web共有」からURLをもう一度コピーしてください。");
  if (CK_API_TOKEN.startsWith("__")) return fail("閲覧ページの設定(APIトークン)がまだ完了していません。");
  try {
    state.shareID = shareID;
    state.key = await crypto.subtle.importKey("raw", b64ToBytes(keyText), "AES-GCM", false, ["decrypt"]);
  } catch {
    return fail("共有URLの鍵が正しくありません。URLを最後までコピーしたか確認してください。");
  }
  await refresh();
  setInterval(refresh, REFRESH_MS);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
}
window.addEventListener("hashchange", () => location.reload());

start();
